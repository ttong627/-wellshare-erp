# Cloud Build — 이 파일이 있으면 'gcloud builds submit'으로 자동 빌드+배포 가능
# 단일 명령으로 실행: gcloud builds submit --config=cloudbuild.yaml --substitutions=_REGION=asia-northeast3,_SERVICE=akp-web .

steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/akp-repo/${_SERVICE}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/akp-repo/${_SERVICE}:latest'
      - '.'

  # 2. Artifact Registry로 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/akp-repo/${_SERVICE}'

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/akp-repo/${_SERVICE}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

substitutions:
  _REGION: asia-northeast3   # 서울 리전
  _SERVICE: akp-web

options:
  logging: CLOUD_LOGGING_ONLY
