# WS 통합 예약 시스템 — CI 품질 게이트 (베라)
# - push / pull_request 마다 자동 실행
# - 1) npm ci  2) npm run build  3) npm audit (high+ 차단)  4) firebase emulator + 50개 테스트
#
# 형님 다음 행동: GitHub에 push 후 자동 실행. 별도 secret 필요 없음 (emulator는 demo 프로젝트 사용).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}  # 수동 실행 허용

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (test + build + rules emulator + audit)
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Java 21 설정 (Firestore Emulator 의존)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 의존성 설치
        run: npm ci --legacy-peer-deps

      - name: 프로덕션 빌드
        run: npm run build

      - name: 보안 audit (high 이상이면 실패)
        run: npm audit --omit=dev --audit-level=high

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: 단위 테스트 + Firestore Rules 테스트 (emulator)
        run: firebase emulators:exec --only firestore --project demo-wellshare-erp "npm test"

      # 옵션: PR 미리보기 채널 (Firebase Hosting Preview)
      # 필요 시 GITHUB_TOKEN + FIREBASE_SERVICE_ACCOUNT_WELLSHARE_ERP secret 추가 후 활성화
